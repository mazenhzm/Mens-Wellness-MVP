kind = "api"
previewPath = "/api" # TODO - should be excluded from preview in the first place
title = "API Server"
version = "1.0.0"
id = "3B4_FFSkEVBkAeYMFRJ2e"

[[services]]
localPort = 8080
name = "API Server"
paths = ["/api"]

[services.development]
run = "DEBUG=true REDIS_URL=redis://127.0.0.1:6379/0 uv run --project ../.. --directory ../.. python backend/manage.py runserver 0.0.0.0:$PORT"

[services.development.env]
DEBUG = "true"
REDIS_URL = "redis://127.0.0.1:6379/0"

[services.production]

[services.production.build]
args = ["uv", "sync", "--frozen", "--no-dev"]

[services.production.build.env]
DEBUG = "false"

[services.production.run]
# we don't run through pnpm to make startup faster in production
args = ["uv", "run", "--project", "../..", "--directory", "../..", "--frozen", "gunicorn", "--chdir", "backend", "config.wsgi:application", "--bind", "0.0.0.0:8080"]

[services.production.run.env]
PORT = "8080"
NODE_ENV = "production"

[services.production.health.startup]
path = "/api/healthz"
